[package]
name = "aeordb-client-lib"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE-BSL.md"

[dependencies]
# Engine library. Resolved via the in-repo `aeordb` symlink at the
# aeordb-client root, which points at the sibling aeordb workspace
# (../aeordb under our standard `aeordb-workspace/` layout). We
# previously pulled this as a `{git = …}` dep, which broke on Mac and
# Windows: cargo cached the engine in ~/.cargo/git/checkouts/…, far
# from the aeor-web-components / aeordb-web-components sibling repos
# that the engine's build.rs expects to find by walking ancestor
# directories. With this path dep, the engine source lives at its real
# location, the build.rs walk finds the siblings, and engine changes
# pick up on the next `cargo build` without `cargo update -p aeordb`
# gymnastics.
aeordb = { path = "../aeordb/aeordb-lib" }
anyhow = "1"
# NDJSON-stream progress events for the self-update apply endpoint.
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# Verify-only ed25519 — bundled trust store + self-update manifest sig check.
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8", "pem"] }
futures-util = "0.3"
gethostname = "1"
hex = "0.4"
glob-match = "0.2"
# RFC 8785 canonical JSON — needed to re-canonicalize the signed update
# manifest envelope byte-identically to the signer before verification.
json-canon = "0.1"
notify = "8"
notify-debouncer-full = "0.5"
open = "5"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rfd = "0.15"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }
