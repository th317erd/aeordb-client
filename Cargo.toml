[workspace]
resolver = "2"
members = [
  "aeordb-client-lib",
  "aeordb-client",
]
# The `aeordb` directory is a symlink to the sibling aeordb engine
# repo, brought in as a path dependency by aeordb-client-lib. It has
# its own Cargo workspace (with its own [workspace.package] inheritance
# block), and we must NOT pull it into ours — without this exclude,
# cargo walks up from aeordb-client/aeordb/aeordb-lib/Cargo.toml and
# tries to inherit workspace.package.edition from THIS root manifest,
# which doesn't define one, and the build fails with:
#   error inheriting `edition` from workspace root manifest's
#   `workspace.package.edition`
# Excluding the symlinked subdir tells cargo "this is somebody else's
# workspace, don't try to absorb it."
exclude = [
  "aeordb",
]

# Release profile: strip debug symbols so the Linux binary ships at
# the same size as Mac + Windows release builds. Without this, the
# Linux ELF release came out 32MB (vs 23MB for the others) because
# glibc + ELF debug sections aren't stripped by default; the MSVC
# and Mach-O toolchains don't include the same debug payload in a
# `--release` build, so they naturally ship smaller. `strip = "symbols"`
# removes function-name + debug info from the binary — backtraces in
# the field will show raw addresses rather than function names, but
# the user-facing UI doesn't surface those anyway, and our `tracing`
# log lines already carry the file:line context that matters for
# remote debugging. If we ever ship symbol files for crash-symbolication
# we'll revisit (Cargo split-debuginfo + a separate .debug upload).
[profile.release]
strip = "symbols"
